[project]
name = "raudi"
version = "0.1.0"
description = "Regularly and Automatically Updated Docker Images"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "python-dotenv==1.2.2",
    "python-on-whales==0.81.0",
    "questionary==2.1.1",
    "requests==2.33.0",
]

[project.scripts]
raudi = "raudi.cli:main"

[build-system]
requires = ["uv_build==0.11.29"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
required-version = "==0.11.29"
